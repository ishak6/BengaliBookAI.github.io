<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10251f"><title>বইয়ের লাইব্রেরি · Bengali Book AI</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f2;color:#182820;font-family:system-ui,"Noto Sans Bengali",sans-serif}header{background:#10251f;color:white;padding:18px max(18px,calc((100% - 1000px)/2));display:flex;justify-content:space-between;align-items:center}a{color:#176b4b}header a{color:#d8eee2;text-decoration:none}.wrap{max-width:1000px;margin:auto;padding:30px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.book{background:white;border:1px solid #dce6dd;border-radius:15px;padding:18px}.book h3{margin:0 0 8px}.muted{color:#65746c;font-size:14px}.read{display:inline-block;background:#176b4b;color:white;text-decoration:none;padding:10px 14px;border-radius:9px;margin-top:12px;font-weight:650}.empty{padding:30px;text-align:center;background:white;border-radius:14px;color:#64736d}</style></head><body><header><strong>📚 Bengali Book AI</strong><nav><a href="index.html">প্রশ্ন করুন</a> · <a href="admin.html">Admin</a></nav></header><main class="wrap"><h1>বইয়ের লাইব্রেরি</h1><p class="muted">প্রকাশিত ও অনুমতিপ্রাপ্ত বইগুলো এখানে পড়তে পারবেন।</p><div id="status" class="muted">বইয়ের তালিকা লোড হচ্ছে…</div><section id="books" class="grid"></section></main><script>const API="https://bengali-book-ai-api.bengalibookai.workers.dev";async function load(){const host=document.getElementById("books"),s=document.getElementById("status");try{const r=await fetch(API+"/api/books");const d=await r.json();if(!r.ok)throw new Error(d.error||"API error");host.replaceChildren();if(!d.books?.length){s.textContent="এখনো কোনো বই প্রকাশিত হয়নি।";return}s.textContent=d.books.length+"টি বই পাওয়া গেছে।";for(const b of d.books){const a=document.createElement("article");a.className="book";const h=document.createElement("h3");h.textContent=b.title;const p=document.createElement("p");p.className="muted";p.textContent=(b.author||"লেখক উল্লেখ নেই")+" · "+(b.status==="ready"?"AI প্রস্তুত":b.status==="processing"?"AI প্রস্তুত হচ্ছে":"AI indexing ব্যর্থ — PDF পড়া যাবে");const link=document.createElement("a");link.className="read";link.href="reader.html?id="+encodeURIComponent(b.id);link.textContent="📖 বই পড়ুন";a.append(h,p,link);host.append(a)}}catch(e){s.textContent="বইয়ের তালিকা পাওয়া যায়নি: "+e.message}}load();</script></body></html>
