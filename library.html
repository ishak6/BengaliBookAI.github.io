<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10251f"><title>বইয়ের লাইব্রেরি · Bengali Book AI</title>
<style>
:root{color-scheme:light;--bg:#f4f7f2;--ink:#182820;--muted:#65746c;--green:#176b4b;--line:#dce6dd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}
header{position:sticky;top:0;z-index:4;background:#10251f;color:white;padding:15px max(18px,calc((100% - 1040px)/2));display:flex;justify-content:space-between;align-items:center;box-shadow:0 3px 14px #10251f20}
header a{color:#d8eee2;text-decoration:none;font-size:14px}.brand{font-weight:750;display:flex;align-items:center;gap:10px}.brandmark{width:34px;height:34px;border-radius:11px;background:#dcebdc;color:#173b2b;display:grid;place-items:center}
.wrap{max-width:1040px;margin:auto;padding:26px 18px 60px}.intro{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:20px}.intro h1{font-size:26px;margin:0 0 6px}.intro p{margin:0;color:var(--muted);font-size:13px}
#status{font-size:13px;color:var(--muted);margin:16px 0;min-height:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:17px}
.book{min-width:0;display:block;overflow:hidden;background:white;border:1px solid var(--line);border-radius:15px;color:inherit;text-decoration:none;box-shadow:0 4px 14px #15251b0a;transition:transform .15s,border-color .15s}
.book:active{transform:scale(.985)}.book:hover,.book:focus-visible{border-color:var(--green);outline:2px solid #176b4b20}
.cover{height:210px;background:linear-gradient(145deg,#e3eee3,#b8cfbd);display:grid;place-items:center;overflow:hidden}
.cover img{display:block;width:100%;height:100%;object-fit:contain;background:#eee9dc}
.cover .placeholder{font-size:55px;opacity:.55}
.bookinfo{padding:12px 13px 15px}.book h2{font-size:14px;line-height:1.5;margin:0 0 5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.book p{font-size:12px;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:30px;text-align:center;background:white;border-radius:14px;color:var(--muted)}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:20px}.cover{height:250px}.wrap{padding-top:34px}}
</style></head>
<body>
<header><div class="brand"><span class="brandmark">বই</span><span>Bengali Book AI</span></div><a href="index.html">AI-কে প্রশ্ন করুন →</a></header>
<main class="wrap"><div class="intro"><div><h1>আপনার বইয়ের তাক</h1><p>বইয়ের প্রচ্ছদে চাপ দিন, পড়া শুরু করুন।</p></div></div><div id="status">বইয়ের তালিকা লোড হচ্ছে…</div><section id="books" class="grid" aria-live="polite"></section></main>
<script>
"use strict";
const API="https://bengali-book-ai-api.bengalibookai.workers.dev";
const host=document.getElementById("books"),status=document.getElementById("status");
function makeBook(book){
 const a=document.createElement("a");a.className="book";a.href="reader.html?id="+encodeURIComponent(book.id);
 a.setAttribute("aria-label",(book.title||"বই")+" খুলুন");
 const cover=document.createElement("div");cover.className="cover";
 const fallback=document.createElement("span");fallback.className="placeholder";fallback.textContent="📖";cover.append(fallback);
 if(book.cover_url){
  const img=document.createElement("img");img.alt=(book.title||"বই")+" প্রচ্ছদ";img.loading="lazy";img.decoding="async";
  img.onerror=()=>{img.remove();fallback.textContent="📕"};
  img.src=book.cover_url;cover.append(img);
 }
 const info=document.createElement("div");info.className="bookinfo";
 const title=document.createElement("h2");title.textContent=book.title||"শিরোনাম নেই";
 const author=document.createElement("p");author.textContent=book.author||"লেখক উল্লেখ নেই";
 info.append(title,author);a.append(cover,info);return a;
}
async function load(){
 try{
  const response=await fetch(API+"/api/books",{cache:"no-store"});
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"API error");
  host.replaceChildren();
  const books=data.books||[];
  if(!books.length){status.textContent="এখনো কোনো বই প্রকাশিত হয়নি।";return}
  status.textContent=books.length.toLocaleString("bn-BD")+"টি বই পাওয়া গেছে";
  books.forEach(book=>host.append(makeBook(book)));
 }catch(error){status.textContent="বইয়ের তালিকা লোড হয়নি: "+error.message}
}
load();
</script></body></html>
