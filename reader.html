<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>বই খুলছে… · Bengali Book AI</title>
</head>
<body>
  <p>বইয়ের PDF খোলা হচ্ছে…</p>
  <script>
    const API = "https://bengali-book-ai-api.bengalibookai.workers.dev";
    const id = new URLSearchParams(location.search).get("id");
    if (id) {
      location.replace(API + "/api/books/" + encodeURIComponent(id) + "/file");
    } else {
      location.replace("library.html");
    }
  </script>
</body>
</html>
