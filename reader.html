<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10251f"><title>বই পড়ুন · Bengali Book AI</title><style>*{box-sizing:border-box}body{margin:0;background:#e9eee9;color:#172820;font-family:system-ui,"Noto Sans Bengali",sans-serif}header{background:#10251f;color:white;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}header a{color:#e2f0e5;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:14px}h1{font-size:20px;margin:6px 0}.muted{color:#64736d;font-size:13px}iframe{width:100%;height:calc(100dvh - 120px);min-height:500px;border:0;border-radius:10px;background:white}#status{padding:10px}</style></head><body><header><a href="library.html">← লাইব্রেরি</a><strong>Bengali Book AI Reader</strong><a href="index.html">Home</a></header><main class="wrap"><h1 id="title">বই লোড হচ্ছে…</h1><div id="status" class="muted">PDF প্রস্তুত করা হচ্ছে…</div><iframe id="pdf" title="PDF Book Reader" hidden></iframe></main><script>const API="https://bengali-book-ai-api.bengalibookai.workers.dev";const id=new URLSearchParams(location.search).get("id");async function load(){if(!id){document.getElementById("status").textContent="বইয়ের ID পাওয়া যায়নি।";return}try{const r=await fetch(API+"/api/books");const d=await r.json();const b=d.books?.find(x=>x.id===id);if(!r.ok||!b)throw new Error("বইটি পাওয়া যায়নি অথবা Unpublish করা হয়েছে।");document.getElementById("title").textContent=b.title;const frame=document.getElementById("pdf");frame.src=API+"/api/books/"+encodeURIComponent(id)+"/file#toolbar=1&navpanes=0&view=FitH";frame.hidden=false;document.getElementById("status").textContent="PDF Viewer-এ বই পড়ুন। মোবাইলে PDF viewer সমর্থন না করলে Download/Open অপশন ব্যবহার করুন।"}catch(e){document.getElementById("status").textContent=e.message}}load();</script></body></html>
