<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a18"><meta name="description" content="বাংলা বই ও AI সহকারী"><title>Bengali Book AI — আপনার AI পাঠসঙ্গী</title>
<style>
:root{color-scheme:dark;--bg:#0d1412;--panel:#17211d;--card:#1b2822;--line:#2b3b33;--ink:#edf4ee;--muted:#9eafa4;--green:#8ac7a0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}body{height:100dvh;overflow:hidden}
header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:#111b17}
.brand{display:flex;align-items:center;gap:10px;font-weight:750}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,#d8f1d8,#d9b96c);color:#173528;display:grid;place-items:center;font-size:19px}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500}
.head-actions{display:flex;gap:8px}.head-actions a,.head-actions button{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:9px 12px;font:inherit;font-size:13px}
.layout{height:calc(100dvh - 62px);max-width:1020px;margin:auto;display:flex;flex-direction:column;padding:0 14px}
.welcome{text-align:center;padding:25px 8px 14px}.welcome h1{font-size:clamp(23px,4vw,31px);margin:0 0 7px}.welcome p{color:var(--muted);font-size:13px;margin:0}
#chat{flex:1;min-height:0;overflow:auto;padding:8px 2px 22px;scroll-behavior:smooth}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}.suggestions button{background:#17241e;color:#d7e8dc;border:1px solid #30463a;border-radius:22px;padding:9px 13px;font:inherit;font-size:12px}
.msg{display:flex;margin:15px 0;gap:10px;align-items:flex-start}.msg.user{justify-content:flex-end}.avatar{width:30px;height:30px;border-radius:11px;flex:none;display:grid;place-items:center;background:#284b39;color:#e7f5e9;font-size:12px}.bubble{max-width:min(790px,88%);padding:13px 15px;border-radius:17px;background:var(--card);border:1px solid var(--line);line-height:1.75;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#214d37;border-color:#326c4c;border-top-right-radius:5px}.assistant .bubble{border-top-left-radius:5px}.bubble h3{font-size:14px;margin:0 0 7px;color:#cce5d0}.bubble p{margin:0 0 9px}.bubble p:last-child{margin-bottom:0}.sources{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:#c3d3c8}.sources div{padding:5px 0}
.composer-wrap{flex:none;padding:10px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 12%)}
.composer{background:#17211d;border:1px solid #34473b;border-radius:22px;padding:10px;box-shadow:0 10px 34px #0005}
.modebar{display:flex;gap:6px;flex-wrap:wrap;padding:0 4px 8px}.mode{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:18px;padding:7px 11px;font:inherit;font-size:12px}.mode.active{background:#284a36;color:#e4f3e7;border-color:#426b4d}
.entry{display:flex;align-items:flex-end;gap:8px}.entry textarea{flex:1;min-height:48px;max-height:140px;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;line-height:1.6;padding:9px 7px}.entry textarea::placeholder{color:#85958a}
.action{width:42px;height:42px;flex:none;border:1px solid var(--line);border-radius:14px;background:#22332a;color:var(--ink);font-size:18px}.send{background:#78b98d;color:#102217;border:0;font-weight:800}.send:disabled{opacity:.4}
.meta{display:flex;justify-content:space-between;align-items:center;padding:7px 7px 0;color:#819287;font-size:10px}
.preview{display:none;align-items:center;gap:10px;padding:8px}.preview img{max-height:66px;max-width:90px;border-radius:8px}.preview button{background:transparent;color:#f1b0a8;border:0;font-size:12px}
#status{font-size:11px;color:var(--muted);padding:4px 7px;min-height:18px}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:#a8cbb2;animation:pulse 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes pulse{50%{opacity:.25;transform:translateY(-3px)}}
@media(min-width:700px){.layout{padding:0 22px}.welcome{padding-top:30px}.bubble{font-size:15px}}
@media(max-width:520px){header{height:56px;padding:0 11px}.layout{height:calc(100dvh - 56px);padding:0 10px}.welcome{padding:18px 5px 10px}.welcome p{font-size:12px}.head-actions a{padding:8px 9px}.bubble{max-width:92%;font-size:14px}.meta span:last-child{display:none}}
</style></head><body>
<header><div class="brand"><div class="logo">বই</div><div>Bengali Book AI<small>আপনার বাংলা AI পাঠসঙ্গী</small></div></div><div class="head-actions"><a href="library.html">📚 বই</a><button id="newChat" type="button">＋ নতুন চ্যাট</button></div></header>
<div class="layout"><section class="welcome" id="welcome"><h1>আজ কী জানতে চাও?</h1><p>বইয়ের সূত্রসহ উত্তর, অথবা সাধারণ AI-এর সঙ্গে কথা বলো।</p><div class="suggestions"><button type="button" data-prompt="কৃত্রিম বুদ্ধিমত্তা কীভাবে কাজ করে?">AI কীভাবে কাজ করে?</button><button type="button" data-prompt="বাংলাদেশের মুক্তিযুদ্ধ সম্পর্কে সংক্ষেপে বলো।">বাংলাদেশের ইতিহাস</button><button type="button" data-prompt="এই বিষয়টি সহজ বাংলায় বুঝিয়ে দাও।">সহজ করে বুঝিয়ে দাও</button></div></section>
<main id="chat" aria-live="polite"></main>
<div class="composer-wrap"><div class="composer"><div class="modebar" role="group" aria-label="উত্তরের ধরন"><button class="mode active" data-mode="auto">✨ AI + বই</button><button class="mode" data-mode="general">💬 সাধারণ AI</button><button class="mode" data-mode="book">📚 শুধু বই</button></div>
<div class="preview" id="preview"><img id="previewImg" alt="প্রশ্নের ছবি"><span id="previewName" style="font-size:12px;color:var(--muted);flex:1"></span><button id="removeImage" type="button">বাদ দিন ✕</button></div>
<div class="entry"><label class="action" for="imageFile" style="display:grid;place-items:center;cursor:pointer" title="ছবি বা ক্যামেরা">＋</label><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden><textarea id="question" rows="1" maxlength="1200" placeholder="এখানে প্রশ্ন লিখুন…"></textarea><button class="action send" id="send" type="button" disabled aria-label="পাঠান">➤</button></div>
<div class="meta"><span>ছবি / ক্যামেরা · সর্বোচ্চ ৮ MB</span><span>AI উত্তর ভুল হতে পারে—গুরুত্বপূর্ণ তথ্য যাচাই করুন</span></div></div><div id="status" role="status"></div></div></div>
<script>
const API="https://bengali-book-ai-api.bengalibookai.workers.dev";
const $=id=>document.getElementById(id);let mode="auto",image=null,history=[],busy=false;
const chat=$("chat"),q=$("question"),send=$("send");
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll(".mode").forEach(x=>x.classList.toggle("active",x===b));});
function refresh(){send.disabled=busy||(!q.value.trim()&&!image)}
q.addEventListener("input",()=>{q.style.height="auto";q.style.height=Math.min(q.scrollHeight,140)+"px";refresh()});
function addMessage(role,text,sources=[]){$("welcome").style.display="none";const row=document.createElement("div");row.className="msg "+role;const av=document.createElement("div");av.className="avatar";av.textContent=role==="user"?"তুমি":"AI";const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=text;if(sources.length){const box=document.createElement("div");box.className="sources";const h=document.createElement("b");h.textContent="📚 বইয়ের সূত্র";box.append(h);sources.forEach(s=>{const line=document.createElement("div");line.textContent=(s.title||"বই")+" · পৃষ্ঠা "+(s.page_number||"?")+(s.chapter?" · "+s.chapter:"");box.append(line)});bubble.append(box)}if(role==="user"){row.append(bubble,av)}else{row.append(av,bubble)}chat.append(row);chat.scrollTop=chat.scrollHeight;return bubble}
function addTyping(){const b=addMessage("assistant","");b.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';return b}
function showAnswer(b,d,selectedMode){b.replaceChildren();const add=(label,value)=>{if(!value)return;const h=document.createElement("h3");h.textContent=label;b.append(h);const p=document.createElement("p");p.textContent=value;b.append(p)};if(d.recognized_text)add("📝 ছবিতে শনাক্ত লেখা",d.recognized_text);if(selectedMode==="general")add("উত্তর",d.answer);else{add("📚 বইভিত্তিক উত্তর",d.book_answer);add("✨ সাধারণ AI ব্যাখ্যা",d.general_explanation);if(selectedMode==="auto"&&!d.book_answer&&!d.general_explanation)add("উত্তর",d.answer||"বইয়ে সূত্র পাওয়া যায়নি।");if(selectedMode==="book"&&!d.sources?.length)add("🔎 অনুসন্ধান","প্রস্তুত বইয়ে নির্ভরযোগ্য সূত্র পাওয়া যায়নি।")}if(d.sources?.length){const box=document.createElement("div");box.className="sources";const h=document.createElement("b");h.textContent="📚 সূত্র";box.append(h);d.sources.forEach(s=>{const line=document.createElement("div");line.textContent=(s.title||"বই")+" · পৃষ্ঠা "+s.page_number+(s.chapter?" · "+s.chapter:"");box.append(line)});b.append(box)}chat.scrollTop=chat.scrollHeight}
async function submit(){const text=q.value.trim();if(busy||(!text&&!image))return;busy=true;refresh();$("welcome").style.display="none";const sentMode=mode;addMessage("user",text||(image?"ছবি পাঠানো হয়েছে":""));const typing=addTyping();$("status").textContent="উত্তর তৈরি হচ্ছে…";const previous=history.slice(-8);try{let response;if(image){const form=new FormData();form.append("image",image);form.append("question",text);form.append("mode",sentMode);response=await fetch(API+"/api/ask-image",{method:"POST",body:form})}else{response=await fetch(API+"/api/ask",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({question:text,mode:sentMode,history:previous})})}const data=await response.json();if(!response.ok)throw new Error(data.error||"সার্ভার সমস্যা");showAnswer(typing,data,sentMode);const answer=sentMode==="general"?data.answer:[data.book_answer,data.general_explanation].filter(Boolean).join("\n\n");history.push({role:"user",content:text||"ছবি থেকে প্রশ্নের উত্তর দাও"},{role:"assistant",content:answer||"উত্তর পাওয়া যায়নি"});history=history.slice(-8);$("status").textContent="উত্তর তৈরি হয়েছে";image=null;$("imageFile").value="";$("preview").style.display="none";$("previewImg").removeAttribute("src");q.value="";q.style.height="auto"}catch(e){typing.textContent="সমস্যা: "+e.message;$("status").textContent="অনুরোধ ব্যর্থ হয়েছে"}finally{busy=false;refresh();q.focus()}}
send.onclick=submit;q.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();submit()}});
$("imageFile").onchange=()=>{const f=$("imageFile").files?.[0];if(!f)return;if(!["image/jpeg","image/png","image/webp"].includes(f.type)||f.size>8*1024*1024){$("status").textContent="JPG, PNG বা WEBP ছবি দিন; সর্বোচ্চ ৮ MB।";$("imageFile").value="";return}image=f;$("previewImg").src=URL.createObjectURL(f);$("previewName").textContent=f.name;$("preview").style.display="flex";refresh()};
$("removeImage").onclick=()=>{image=null;$("imageFile").value="";$("preview").style.display="none";refresh()};
$("newChat").onclick=()=>{chat.replaceChildren();history=[];image=null;$("imageFile").value="";$("preview").style.display="none";q.value="";$("welcome").style.display="block";$("status").textContent="নতুন চ্যাট শুরু হয়েছে";refresh();q.focus()};
document.querySelectorAll("[data-prompt]").forEach(b=>b.onclick=()=>{q.value=b.dataset.prompt;refresh();submit()});
refresh();
</script></body></html>
