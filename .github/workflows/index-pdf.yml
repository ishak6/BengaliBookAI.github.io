name: Index PDF into D1

on:
  workflow_dispatch:
    inputs:
      book_id:
        description: Book ID returned by the admin panel
        required: true
        type: string
      release_url:
        description: Public GitHub Release PDF asset URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: book-index-${{ inputs.book_id }}
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bengali OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ben tesseract-ocr-eng
      - name: Install PDF and OCR libraries
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.4 Pillow pytesseract
      - name: Extract PDF pages and index in D1
        env:
          WORKER_ADMIN_API_TOKEN: ${{ secrets.WORKER_ADMIN_API_TOKEN }}
          BOOK_ID: ${{ inputs.book_id }}
          PDF_URL: ${{ inputs.release_url }}
          WORKER_API_URL: https://bengali-book-ai-api.bengalibookai.workers.dev
        run: python scripts/index_pdf.py
