name: Index PDF into D1

on:
  workflow_dispatch:
    inputs:
      book_id:
        description: Book ID returned by the admin panel
        required: true
        type: string
      release_url:
        description: Public GitHub Release PDF asset URL
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: book-index-${{ inputs.book_id }}
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bengali OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ben tesseract-ocr-eng
      - name: Verify Tesseract languages
        run: |
          tesseract --version
          tesseract --list-langs
      - name: Install PDF and OCR libraries
        run: python -m pip install --disable-pip-version-check "PyMuPDF==1.26.4" "Pillow>=10.4,<13" "pytesseract==0.3.13"
      - name: Validate Python files
        run: python -m py_compile scripts/index_pdf.py scripts/ocr_quality.py scripts/test_ocr_quality.py scripts/generate_covers.py
      - name: Run OCR quality unit tests
        run: python -m unittest discover -s scripts -p 'test_ocr_quality.py' -v
      - name: Extract PDF pages and index in D1
        env:
          WORKER_ADMIN_API_TOKEN: ${{ secrets.WORKER_ADMIN_API_TOKEN }}
          BOOK_ID: ${{ inputs.book_id }}
          PDF_URL: ${{ inputs.release_url }}
          WORKER_API_URL: https://bengali-book-ai-api.bengalibookai.workers.dev
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/index_pdf.py

      - name: Mark book indexing as failed
        if: failure()
        env:
          WORKER_ADMIN_API_TOKEN: ${{ secrets.WORKER_ADMIN_API_TOKEN }}
          BOOK_ID: ${{ inputs.book_id }}
          WORKER_API_URL: https://bengali-book-ai-api.bengalibookai.workers.dev
        run: |
          if [ -z "$WORKER_ADMIN_API_TOKEN" ] || [ -z "$BOOK_ID" ]; then
            echo "::warning::Cannot update book failure status because required credentials are missing."
            exit 0
          fi
          curl --silent --show-error --fail-with-body -X POST "$WORKER_API_URL/api/admin/books/$BOOK_ID/fail" \
            -H "Authorization: Bearer $WORKER_ADMIN_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"reason":"GitHub Actions indexing failed"}' || true
