name: Sync Worker Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Verify required secrets are present
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_API_TOKEN }}
          AI_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test "${#ADMIN_TOKEN}" -ge 32 || { echo "WORKER_ADMIN_API_TOKEN must be at least 32 characters"; exit 1; }
          test -n "$AI_KEY" || { echo "Missing OPENROUTER_API_KEY"; exit 1; }
          echo "Required secret inputs are present."
      - name: Sync secrets to Cloudflare Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_API_TOKEN }}
          AI_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ADMIN_TOKEN" | wrangler secret put ADMIN_API_TOKEN --config wrangler.jsonc
          printf '%s' "$AI_KEY" | wrangler secret put AI_API_KEY --config wrangler.jsonc
          echo "Worker secrets synchronized. Values were not printed."
