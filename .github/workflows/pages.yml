name: Deploy Bengali Book AI Website

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "admin.html"
      - "scripts/index_pdf.py"
      - "worker/package.json"
      - "worker/test/**"
      - ".github/workflows/index-pdf.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run AI quality harness
        run: npm test --prefix worker
      - name: Validate Worker JavaScript
        run: node --check worker/src/index.js
      - name: Validate PDF indexer Python syntax
        run: python -m py_compile scripts/index_pdf.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
